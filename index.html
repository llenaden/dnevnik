  --bg:#F7F7F7; --card:#FFFFFF; --fill:#EEEEEE; --btn:#EEEEEE; --circle:#EEEEEE; --line:#ECECEC; --sel:#E0E0E0; --focus:#8FB3E8;

  --field:#EEEEEE; --acc-bg:#CADFFF; --acc:#245BD1; --acc-mute-bg:#E8F0FF; --acc-mute:#93B2E8;
  --hint:#FFFFFF; --hint-line:#FFFFFF;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --h1:18px; --h2:14px; --body:14px; --btn-t:12px; --cap:11px;
  --in:10px; --out:20px; --inner:12px; --pad:20px; --r:24px; --tile:44px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
body{background:var(--bg);color:var(--ink);font:500 var(--body)/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus{outline:none}
button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--focus)}
input,textarea{outline:none}
p{margin:0}

.h1{font-size:var(--h1);font-weight:800;line-height:1.25;letter-spacing:-.01em}
.h2,.b{font-size:var(--h2);font-weight:700;line-height:1.35}
.cap{font-size:var(--cap);font-weight:500;color:var(--muted);line-height:1.4}
.num{font-variant-numeric:tabular-nums}
.gh{padding-left:4px}

.app{max-width:460px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:30px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:var(--out)}
.grp{display:flex;flex-direction:column;gap:var(--in)}
.daycol{display:flex;flex-direction:column;gap:var(--out)}

/* icons */
.ui{width:20px;height:20px;flex:none;display:block}
.tile{width:var(--tile);height:var(--tile);border-radius:13px;display:grid;place-items:center;flex:none;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -1px 2px rgba(0,0,0,.16),0 3px 8px rgba(0,0,0,.10)}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(90% 60% at 30% 0%,rgba(255,255,255,.28),transparent 60%);pointer-events:none}
.tile svg{position:relative;z-index:1;width:44px;height:44px;color:rgba(255,255,255,.96)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px 0 11px;border-radius:999px;background:var(--acc-bg);color:var(--acc);font-size:12px;font-weight:700}
.pill .ui{width:16px;height:16px}
.row{display:flex;align-items:center;gap:4px}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ib.f{background:var(--card)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:999px;padding:3px;height:49px}
.seg button{height:43px;border-radius:999px;font-size:var(--btn-t);font-weight:700;color:var(--muted);text-align:center}
.seg button.on{background:#E9E9E9;color:var(--ink);box-shadow:none}
.view>.seg button{color:var(--ink)}
.seg,.fch,.nav .in{position:relative}
.seg>button,.fch>button,.nav .in>button{position:relative;z-index:1}
.seg>button.on,.nav .in>button.on,.card .seg>button.on{background:transparent!important;box-shadow:none!important;animation:none!important}
.qrow .seg button.on::before{display:none}
.thumb{position:absolute;left:0;top:0;border-radius:999px;pointer-events:none;z-index:0;background:var(--fill)}
.card .seg>.thumb{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.nav .in>.thumb{background:var(--circle)}
.card .seg{background:var(--field)}
.card .seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.view>.ctl{margin-bottom:calc(var(--in) - var(--out))}

/* cards */
.card,.item,.hab,.dc,.art,.pl,.streak{background:var(--card);border-radius:var(--r);padding:var(--pad);width:100%}
.streak .h2{font-weight:800}
.item,.art,.pl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.item,.card.repc{padding-block:12px}
.add.more{width:auto;align-self:flex-start;height:36px;padding:0 16px 0 12px;background:var(--card);color:var(--ink)}
body.t2 .add.more{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.add.more .ui{width:16px;height:16px}
.tx{min-width:0;overflow-wrap:anywhere}
.tx>*+*{margin-top:4px}
.art .tx>.b{margin-top:6px}
.ck{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--sel);display:grid;place-items:center;color:transparent;flex:none}
.ck.on{background:var(--dark);box-shadow:none;color:#fff}
.ck[disabled]{opacity:.35}
.ck .ui{width:18px;height:18px}
.chev{color:#BDBDBD;display:grid}

/* hint plaque */
.hint{background:var(--hint);box-shadow:inset 0 0 0 1px var(--hint-line);border-radius:14px;will-change:height,opacity;contain:paint;padding:var(--pad);width:100%;position:relative}
.hint-b{display:block;width:100%}
.hint-x{position:absolute;top:2px;right:2px;width:32px;height:32px;color:var(--muted)}
.hint-x .ui{width:16px;height:16px}
.dayh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dayh .gh .cap,.cyh .cap{color:#6B6B6E}
.restb{display:flex;align-items:center;gap:8px}
.dayc{display:flex;align-items:center;gap:6px;padding-top:2px}
.ib.rect{width:32px;height:32px;color:var(--muted)}
.ib.rect .ui{width:20px;height:20px;transition:transform .45s var(--ease)}
.ib.rect.open .ui{transform:rotate(180deg)}
.repc{display:flex;flex-direction:column;gap:var(--inner)}
.rh{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
.rh-b{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;min-width:0}
.hint.collapsed,.rep-body.collapsed{display:none}
.repc:not(.open) .rep-body{display:none}
.rsub.gone{display:none}
.rep-body{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rep-body .rs{display:flex;flex-direction:column;gap:8px;padding-block:var(--inner);border-top:1px solid var(--line)}
.rep-body .rs:first-child{border-top:0}.rep-body .rs:last-child{padding-bottom:0}
.bgp{display:flex;flex-direction:column;gap:var(--inner)}
.bgp .bh .cap{margin-left:auto}
.bgsec{display:flex;flex-direction:column;gap:8px}
.bgs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.opts{display:flex;flex-direction:column;gap:10px;padding-top:var(--inner);border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px;text-align:left;width:100%}
.opt.gone{display:none}
.opt{position:relative}
.bgs .bgadd.pick{position:relative;overflow:hidden;background:conic-gradient(#ff5f6d,#ffc371,#f9f871,#7be495,#5ac8fa,#8e7cf8,#ff6fb5,#ff5f6d)}
.bgs .pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.adot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.opt>.b{font-size:var(--h2);min-width:0}
.seg.sm{display:inline-grid;grid-auto-columns:auto;height:34px;padding:2px;flex:none}
.seg.sm button{height:30px;padding:0 12px;font-size:var(--btn-t)}
.bgs button{aspect-ratio:1;max-width:44px;width:100%;justify-self:center;border-radius:50%;background:linear-gradient(135deg,var(--a) 20%,var(--b) 80%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.bgs button.on{box-shadow:inset 0 0 0 1px rgba(0,0,0,.05),0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.restb .cap{font-size:var(--btn-t);font-weight:700;color:var(--ink)}
.rec-show{align-self:flex-start;font-size:var(--btn-t);font-weight:700;color:var(--acc-ink,var(--acc));padding:2px 4px}
.sumc{display:flex;flex-direction:column;padding-block:6px}
.sumc .ss{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.sumc .ss:first-child{border-top:0}
.sumc .go{flex-direction:row;align-items:center;justify-content:space-between;text-align:left;color:var(--acc-ink,var(--acc))}
.sumc .go .b{color:var(--acc-ink,var(--acc));font-size:var(--btn-t);font-weight:700}.sumc .go .ui{width:16px;height:16px}
.stats4.sm{padding-top:4px}
.pc.okc{gap:6px}.pc.okc .ui{width:14px;height:14px;color:#34B36A}
.fr0{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.app-i{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.app-i .cap{color:var(--ink);line-height:1.3}
.pick .app-i .tile{transition:opacity .15s}
.pick .app-i.on .tile{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--sel),inset 0 1px 1px rgba(255,255,255,.5)}
.pick .app-i.off .tile{opacity:.4;filter:saturate(.5)}

/* buttons */
.add{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:999px;background:var(--btn);font-size:var(--btn-t);font-weight:700;width:100%;flex:none}
.btn{height:48px;min-height:48px;border-radius:999px;background:var(--acc-bg);color:var(--acc);font-size:var(--btn-t);font-weight:700;width:100%;text-align:center;flex:none}
.del{height:48px;min-height:48px;border-radius:999px;background:rgba(255,59,48,.06);color:rgba(230,70,60,.75);font-size:var(--btn-t);font-weight:700;width:100%;text-align:center;flex:none}
.del.arm{background:rgba(255,59,48,.14);color:#E5463C}
.soft{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:var(--btn);font-size:var(--btn-t);font-weight:700;color:var(--ink);text-decoration:none;align-self:flex-start}

/* 7-day rows: fixed columns so the first circle lines up with the card's padding edge */
.r7{display:grid;grid-template-columns:repeat(7,38px);justify-content:space-between;row-gap:10px;justify-items:center}
.r7 .hd{color:var(--muted);font-size:var(--cap)}
.mgrid{row-gap:6px}
.r7r{display:grid;grid-template-columns:repeat(7,38px) 40px;justify-content:space-between;justify-items:center;align-items:center}
.r7r .hd{color:var(--muted);font-size:var(--cap);padding-bottom:6px}
.cell{height:46px;display:grid;place-items:center}
.c,.sd,.hd2{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:600;background:var(--fill);font-variant-numeric:tabular-nums;position:relative}
.c.past,.sd,.hd2{color:#77777D}
.c.ring,.sd.today,.hd2.today{color:var(--ink);font-weight:800;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
.c.on,.sd.on{background:var(--dark);color:#fff;box-shadow:none}
.c .dm{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--orange)}
.c .dm.rest{background:#9B6BFF}
.c.on .dm{background:#fff}
.sd>svg{width:22px;height:22px}
.sd.train{background:var(--dark);color:#fff}
.c.future,.sd.future,.hd2.future{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:#A4A4AA}
.sd.out{background:transparent;color:#C9C9C9}
.sd .pd{position:absolute;top:0;right:0;width:10px;height:10px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px var(--card)}
.sd.per{background:#FF5A6E;color:#fff;box-shadow:none}
.sd .hx{position:absolute;bottom:1px;left:50%;width:11px;height:11px;margin-left:-5.5px;color:#FF4F9A}
.sd.per .hx,.sd.on .hx{color:#fff}
.hd2 .ui{width:18px;height:18px}
.hd2.on{background:var(--dark);color:#fff}
.hd2.on.today,.sd.now,.c.on.ring{box-shadow:none}

.rail{height:46px;width:40px;display:grid;place-items:center;background:var(--orange-soft)}
.rail.first{border-radius:20px 20px 0 0}.rail.last{border-radius:0 0 20px 20px}.rail.first.last{border-radius:20px}
.rk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:#fff}
.rk .ui{width:16px;height:16px}
.rk.no{background:var(--card)}
.ro{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line)}
.flame{position:relative;width:40px;height:46px;display:grid;place-items:end center}
.flame b{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:var(--cap)}

.stats+.r7{margin-top:var(--inner)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--in)}
.st{display:flex;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:var(--inner)}
.bars{display:flex;flex-direction:column;gap:var(--inner)}
.bar{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.bar .r{display:flex;justify-content:space-between;gap:8px}
.track{height:6px;border-radius:3px;background:var(--fill);margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;background:var(--dark);border-radius:3px}

/* days list */
.dc{display:flex;flex-direction:column;gap:var(--inner)}
.dc .h{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start}
.dc .h .tx{padding-top:2px}
.stt{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff}
.stt .ui{width:16px;height:16px}
.stt.done{background:#34C759}.stt.partial{background:#FF9F0A}.stt.rest{background:#9B6BFF}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pc{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;background:var(--fill);font-size:var(--cap)}

/* food */
.fl{display:flex;flex-direction:column;gap:var(--inner)}
.fr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;width:100%;text-align:left}
.fr>.fd{margin-top:7px}.fr>.fb{margin-top:1px}
.fr .tx{min-width:0}
.fd{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.fb{font-size:var(--cap);font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.l0 .fd,.fd.l0{background:#34B36A}.fb.l0{background:#E5F5EB;color:#23824B}
.l1 .fd,.fd.l1{background:#F2A93B}.fb.l1{background:#FFF2DC;color:#B26B00}
.l2 .fd,.fd.l2{background:#EF5B5B}.fb.l2{background:#FFE6E6;color:#D23B3B}
.l3 .fd,.fd.l3{background:#C9C9C9}.fb.l3{background:var(--fill);color:var(--muted)}
.fsel{box-shadow:inset 0 0 0 1px var(--sel);border-radius:14px;margin:-8px;padding:8px;width:calc(100% + 16px)}
.stats4{display:flex;justify-content:space-between}
.card.kb{padding-inline:var(--pad)}
.kb>.cap{line-height:1.45}
.stats4>div>*+*{margin-top:4px}
.ff{display:flex;flex-direction:column;gap:var(--in)}
.sug{display:flex;flex-wrap:wrap;gap:6px}
.sug button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--fill);font-size:var(--btn-t);font-weight:700}
.qrow{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center}
.gone{display:none!important}
.qrow .seg{display:flex;justify-content:space-between;padding:3px 18px;height:49px;background:var(--field)}
.qrow .seg button{height:43px}
#fDyn:empty{display:none}
.qrow .fw .inp{padding-left:0;padding-right:0;text-align:center}
.add{background:var(--acc-bg);color:var(--acc)}
#fAct .add:not(.ready){background:var(--acc-mute-bg);color:var(--acc-mute)}
.qrow .seg button{font-size:var(--btn-t);padding:0;flex:none;position:relative;z-index:0;background:none;box-shadow:none}
.qrow .seg button::after{content:"";position:absolute;inset:0 -11px}
.qrow .seg button.on{background:none;box-shadow:none}
.qrow .seg button.on{color:var(--ink)}
.qrow .seg button.on::before{content:"";position:absolute;inset:0 -15px;border-radius:999px;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.08);z-index:-1}
.pc.l0,.pc.l1,.pc.l2,.pc.l3{gap:6px}
.lnote{font-size:var(--cap);color:var(--muted);line-height:1.4}
.own{display:flex;flex-direction:column;gap:var(--in)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{height:32px;padding:0 12px;border-radius:999px;background:var(--fill);font-size:var(--btn-t);font-weight:700;color:var(--ink)}
.cats button.on{background:var(--dark);color:#fff}
.nf2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lk{align-self:flex-start;font-size:var(--btn-t);font-weight:700;color:var(--acc-ink,var(--acc));padding:2px 0}

/* notes, norms, pills calendar */
.fw.area.big{height:340px}.fw.area.big .inp{height:389px}
.abody a{color:#3D6FD6;word-break:break-all}
.nf3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fw.unit .inp{padding-right:34px}
.fw.unit .inp:placeholder-shown+.u{opacity:0}
.fw.unit .u{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:var(--cap);color:var(--muted);pointer-events:none}
.seg.big{height:49px;padding:3px}
.seg.big button{height:43px}
.bh0{display:block;width:100%;text-align:left}
.hcal{margin-top:2px;align-self:stretch}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:#FFE6DC;color:#E2603A;font-size:var(--cap);font-weight:700;vertical-align:2px;margin-left:4px}

/* weight */
.wbox{position:relative;height:90px}
.wch{position:absolute;inset:0;width:100%;height:100%}
.wdots{position:absolute;inset:0;pointer-events:none}
.wdots i{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--acc-ink,var(--acc));box-shadow:0 0 0 2px var(--card)}
.card .r.cap{display:flex;justify-content:space-between}

.tbtn{display:block;border-radius:13px}

/* ---------- new home design (body.t2) ---------- */
body.t2{--bg:#F2F3F6;--r:18px;--field:#F3F4F7;--fill:#F3F4F7;--circle:#F3F4F7;--acc-bg:#262626;--acc:#fff;--acc-mute-bg:#E3E3E3;--acc-mute:#9A9A9A;
  --sh:0 1px 2px rgba(25,40,70,.04),0 8px 24px rgba(25,40,70,.07);
  --g1:#BCD4EC;--g2:#F0E2AA;--gh:80vh;--acc-ink:#262626;--acc-sh:rgba(0,0,0,.16);--focus:#8E8E8E;
  background:#F2F3F6;
  transition:--g1 .7s var(--ease),--g2 .7s var(--ease)}
#bgl{display:none}
body.t2 #bgl{display:block;position:fixed;left:0;right:0;top:0;height:var(--gh);z-index:-1;pointer-events:none;overflow:hidden;transform:translateZ(0);
  background:linear-gradient(180deg,rgba(242,243,246,0) 0%,rgba(242,243,246,.16) 14%,rgba(242,243,246,.4) 28%,rgba(242,243,246,.62) 42%,rgba(242,243,246,.8) 56%,rgba(242,243,246,.92) 72%,rgba(242,243,246,.98) 88%,#F2F3F6 100%),linear-gradient(100deg,var(--g1) 0%,var(--g1) 12%,var(--g2) 88%,var(--g2) 100%);background:linear-gradient(180deg,rgba(242,243,246,0) 0%,rgba(242,243,246,.16) 14%,rgba(242,243,246,.4) 28%,rgba(242,243,246,.62) 42%,rgba(242,243,246,.8) 56%,rgba(242,243,246,.92) 72%,rgba(242,243,246,.98) 88%,#F2F3F6 100%),linear-gradient(in oklab 100deg,var(--g1) 0%,var(--g1) 12%,var(--g2) 88%,var(--g2) 100%);transition:height .7s var(--ease)}
#bgi{display:none;position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;-webkit-user-drag:none;user-select:none}
body.t2[data-bg=img] #bgi{display:block}
body.t2.bgscroll #bgl{position:absolute}
body.t2[data-bg=gray] #bgl{display:none}

function cycleInfo(){

  const starts=ks.filter(k=>!S.days[key(add(parse(k),-1))]?.period).map(parse);
  const lens=[];for(let i=1;i<starts.length;i++){const l=daysBetween(starts[i-1],starts[i]);if(l>=18&&l<=45)lens.push(l)}
  const avg=lens.length?Math.round(lens.reduce((a,b)=>a+b,0)/lens.length):null;
  const last=starts[starts.length-1]||null;
  const L=avg||28,ovs=[];
  for(let i=0;i<starts.length;i++){const nx=starts[i+1]||add(starts[i],L);ovs.push(add(nx,-14))}
  if(last){let nx=add(last,L);for(let j=0;j<3;j++){nx=add(nx,L);ovs.push(add(nx,-14))}}
  const ovKeys=new Set(ovs.map(key)),fert=new Set();ovs.forEach(o=>{for(let j=-5;j<=1;j++)if(j)fert.add(key(add(o,j)))});

{id:'checkup',cat:'Чекап',min:4,t:'Базовый чекап раз в год',d:'Анализы, которые показывают отклонения до того, как что-то заболит',b:`
<p>Цель — поймать отклонения рано. Кровь сдают утром натощак, после 8–12 часов без еды, без тренировки накануне.</p>
<h4>Кровь</h4><ul>
<li><b>Общий анализ крови с лейкоформулой</b>: анемия, воспаление, инфекции, проблемы кроветворения.</li>
<li><b>Ферритин и сывороточное железо</b>: скрытый дефицит железа даёт усталость, ломоту, выпадение волос. Особенно важно перед беременностью.</li>
<li><b>Глюкоза натощак и гликированный гемоглобин (HbA1c)</b>: риск диабета.</li>
<li><b>Липидный профиль</b>: холестерин, ЛПНП, ЛПВП, триглицериды. Сосуды и сердце.</li>
<li><b>Печень</b>: АЛТ, АСТ, билирубин, ГГТ.</li>
<li><b>Почки</b>: креатинин с расчётом СКФ, мочевина.</li>
<li><b>ТТГ</b>: щитовидная железа. При отклонении врач добавит свободный Т4 и антитела.</li>
<li><b>Витамин D (25-OH) и B12</b>.</li>
<li><b>С-реактивный белок</b>: скрытое воспаление.</li></ul>
<h4>Моча</h4><ul><li>Общий анализ мочи: почки, мочевые пути, белок и сахар в моче.</li></ul>
<h4>Без анализов</h4><ul><li>Давление, вес, обхват талии.</li><li>Стоматолог раз в 6–12 месяцев.</li><li>Окулист раз в 1–2 года.</li><li>Дерматолог: осмотр родинок раз в год.</li></ul>
<p class="note">Нормы отличаются в разных лабораториях. Отметка «вне нормы» ещё не диагноз — результаты разбирает терапевт.</p>`},
{id:'cancer',cat:'Чекап',min:5,t:'Скрининг рака: что проверять женщине',d:'Какие обследования реально находят рак рано, а какие не работают',b:`
<p>Скрининг — проверки здоровых людей, чтобы найти рак или предраковые изменения до симптомов. Для нескольких видов рака это доказанно спасает жизни.</p>
<h4>Шейка матки</h4><p>Самый предотвратимый рак. Мазок на цитологию (ПАП-тест) и тест на ВПЧ высокого онкогенного риска. Обычно с 21–25 лет: цитология раз в 3 года или ВПЧ-тест раз в 5 лет. Точную схему назначит гинеколог.</p>
<h4>Молочные железы</h4><p>До 40 лет — осмотр у гинеколога или маммолога, УЗИ по рекомендации врача. Маммография — с 40 лет раз в 1–2 года (в разных странах начинают с 40–50). Раз в месяц после менструации осматривай грудь сама, чтобы замечать изменения.</p>
<h4>Кишечник</h4><p>С 45 лет: анализ кала на скрытую кровь (иммунохимический, FIT) раз в год или колоноскопия раз в 10 лет. Если у близких родственников был рак кишечника, начинают раньше.</p>
<h4>Кожа</h4><p>Осмотр родинок у дерматолога раз в год. Прийти раньше, если родинка меняет форму, цвет, размер или кровоточит.</p>
<h4>Лёгкие</h4><p>Низкодозная КТ нужна курящим или много курившим людям старше 50. Остальным без показаний не делают.</p>
<h4>Что не работает как скрининг</h4><p><b>Онкомаркеры</b> (СА-125, СА 15-3, РЭА и другие) здоровым людям без показаний не сдают: они часто повышены без рака и пропускают ранний рак. Их назначает врач для наблюдения при известном диагнозе.</p>
<h4>Семейная история</h4><p>Если у мамы, сестры или бабушки был рак груди или яичников, особенно до 50 лет, сходи к генетику: может понадобиться анализ на BRCA1/2 и другой график обследований.</p>
<p class="note">Схемы скрининга различаются по странам. Составь свой график с гинекологом и терапевтом.</p>`},
{id:'preg',cat:'Чекап',min:4,t:'Перед беременностью: что проверить',d:'Врачи, анализы и витамины за 3–6 месяцев до планирования',b:`
<p>Лучше начать за 3–6 месяцев до планирования.</p>
<h4>Врачи</h4><ul><li><b>Гинеколог</b>: осмотр, цитология и ВПЧ, УЗИ малого таза, инфекции.</li><li><b>Терапевт</b>: давление, хронические болезни, лекарства, которые ты пьёшь.</li><li><b>Стоматолог</b>: вылечить зубы заранее.</li></ul>
<h4>Анализы</h4><ul><li>Общий анализ крови, ферритин, глюкоза, ТТГ.</li><li>Группа крови и резус-фактор.</li><li>ВИЧ, сифилис, гепатиты B и C.</li><li>Антитела к краснухе. Если их нет, прививку делают заранее и выдерживают паузу перед зачатием.</li><li>Токсоплазма и цитомегаловирус — по назначению врача.</li></ul>
<h4>Витамины</h4><p>Фолиевую кислоту обычно начинают минимум за 1–3 месяца до зачатия. Дозировку, йод, витамин D и железо подбирает врач по анализам.</p>
<h4>Тело</h4><p>Сильный кор, тазовое дно и подвижные тазобедренные суставы облегчают беременность и восстановление. Об этом статья «Кор и тазовое дно к материнству».</p>`},
{id:'allpain',cat:'Чекап',min:3,t:'Когда болит всё сразу: какие анализы сдать',d:'Частые причины ломоты в мышцах и суставах видно в крови',b:`
<p>Если внезапно заболели мышцы, суставы, появилась слабость, начни с терапевта и этих анализов.</p>
<h4>В первую очередь</h4><ul><li><b>Общий анализ крови, СОЭ, С-реактивный белок</b>: есть ли воспаление.</li><li><b>Ферритин</b>: дефицит железа.</li><li><b>Витамин D</b>: при дефиците болят мышцы и кости.</li><li><b>ТТГ</b>: гипотиреоз даёт ломоту и слабость.</li><li><b>Креатинкиназа (КФК)</b>: повреждение мышц, в том числе от перегрузки.</li><li><b>Глюкоза, кальций, магний, калий</b>.</li></ul>
<h4>По решению врача</h4><p>Ревматоидный фактор, антитела к ЦЦП, антинуклеарный фактор — если терапевт заподозрит ревматологическую причину.</p>
<p class="warn"><b>Срочно к врачу:</b> температура вместе с болью; горячий, отёкший, красный сустав; онемение или слабость в руке или ноге; тёмная моча и сильная боль в мышцах после тренировки.</p>
<p class="note">Перед КФК не тренируйся 2–3 дня, иначе результат будет завышен.</p>`},
{id:'belly',cat:'Чекап',min:3,t:'Болит живот: с чего начать',d:'Какие врачи и анализы помогут найти причину',b:`
<h4>Врачи</h4><ul><li><b>Гастроэнтеролог</b>, если боль повторяется.</li><li><b>Гинеколог</b>, если болит внизу живота или боль связана с циклом.</li></ul>
<h4>Обследования</h4><ul><li>УЗИ брюшной полости и малого таза.</li><li>Общий анализ крови, АЛТ, АСТ, билирубин, амилаза, липаза.</li><li><b>Helicobacter pylori</b>: дыхательный тест или антиген в кале.</li><li><b>Кальпротектин в кале</b>: воспаление в кишечнике.</li><li><b>Антитела к тканевой трансглутаминазе IgA и общий IgA</b>: проверка на целиакию. Сдавать, пока ешь глютен.</li></ul>
<h4>Что делать сейчас</h4><p>Записывай в отчёте дня, что ела и когда болело. Через 1–2 недели в сводке будет видна связь — покажи её врачу.</p>
<p class="warn"><b>Срочно в скорую:</b> сильная внезапная боль, твёрдый живот, температура, рвота, чёрный стул или кровь, обморок.</p>`},
{id:'trainpain',cat:'Тело',min:3,t:'Как тренироваться, когда болит',d:'Правило боли и мягкий старт',b:`
<h4>Правило боли</h4><p>Во время упражнения боль до 3 из 10 допустима. Сильнее — снизь нагрузку или пропусти упражнение. На следующий день боль не должна усиливаться.</p>
<h4>Мягкий старт</h4><ul><li>Первые 2–3 недели выбирай на YouTube тренировки с пометками low impact, beginner, для спины.</li><li>Без весов, прыжков и скручиваний на пресс, пока не прошла боль в животе и спине.</li><li>15–25 минут достаточно.</li><li>Разминка 5–7 минут перед каждой тренировкой.</li></ul>
<h4>Восстановление</h4><ul><li>Минимум 2 дня отдыха в неделю.</li><li>Сон 7–9 часов.</li><li>Белок в каждом приёме пищи, вода 1,5–2 литра.</li></ul>`},
{id:'back',cat:'Тело',min:3,t:'Спина: что помогает',d:'Упражнения и привычки, которые разгружают спину',b:`
<h4>Упражнения</h4><ul><li><b>Кошка-корова</b>: 8–10 медленных повторов, можно каждый день.</li><li><b>Птица-собака</b>: на четвереньках вытягиваешь противоположные руку и ногу, держишь 5–10 секунд.</li><li><b>Боковая планка с колен</b>: 15–20 секунд на сторону.</li><li><b>Ягодичный мост</b>: сильные ягодицы разгружают поясницу.</li><li><b>Поза ребёнка</b> для расслабления.</li></ul>
<h4>Привычки</h4><ul><li>Не сиди дольше 40–50 минут подряд.</li><li>При неострой боли прогулки и тепло помогают лучше, чем лежать.</li><li>Поднимай тяжёлое, сгибая колени, близко к телу.</li></ul>

{id:'core',cat:'Тело',min:4,t:'Кор и тазовое дно к материнству',d:'Дыхание, тазовое дно, проверка на диастаз',b:`
<h4>Дыхание 360°</h4><p>Вдох: рёбра расходятся в стороны и назад, тазовое дно мягко опускается. Выдох: подтягиваешь низ живота и тазовое дно. Это основа всех упражнений на кор.</p>
<h4>Тазовое дно</h4><p>Важно не только сжимать, но и полностью расслаблять. Чередуй короткие сжатия и удержания по 5–10 секунд, расслабление в 2 раза дольше.</p>
<h4>Что искать на YouTube</h4><ul><li>Мёртвый жук (dead bug), боковая планка, ягодичный мост.</li><li>Ракушка (clamshell), отведения ноги лёжа.</li><li>Для тазобедренных суставов: «90/90», растяжка сгибателей бедра, hip mobility.</li><li>Пилатес для начинающих.</li></ul>
<h4>Проверь диастаз</h4><p>Лёжа на спине, колени согнуты, приподними голову и прощупай живот по средней линии. Если между мышцами проходит больше двух пальцев, скажи врачу и пока обходись без скручиваний и классической планки.</p>
<p class="note">Одно-два занятия со специалистом по тазовому дну дадут больше, чем месяц самостоятельно.</p>`},
{id:'joints',cat:'Тело',min:2,t:'Суставы хрустят',d:'Когда это нормально, а когда пора к врачу',b:`
<p>Хруст без боли и отёка обычно безопасен: это пузырьки газа в суставной жидкости и скольжение сухожилий.</p>
<h4>Повод к врачу</h4><ul><li>Хруст вместе с болью.</li><li>Отёк, покраснение, сустав горячий.</li><li>Утренняя скованность дольше 30 минут.</li><li>Сустав «заклинивает».</li></ul>
<h4>Что помогает</h4><ul><li>Плавная разминка перед нагрузкой.</li><li>Укрепление мышц вокруг сустава.</li><li>Достаточно воды и движения в течение дня.</li></ul>`},
{id:'week',cat:'Тело',min:3,t:'Как устроена неделя без перегруза',d:'Почему мышцы чередуются, зачем отдых и тазовое дно каждый день',b:`
<p>Мышцам нужно около 48 часов на восстановление после силовой нагрузки, поэтому одну и ту же группу не тренируют два дня подряд. Тазовое дно — исключение: это короткие мягкие упражнения, их можно делать каждый день.</p>
<h4>Неделя по умолчанию</h4><ul>
<li><b>Пн</b>: разминка, руки, плечи, грудь, спина.</li>
<li><b>Вт</b>: разминка, кор.</li>
<li><b>Ср</b>: отдых и прогулка.</li>
<li><b>Чт</b>: разминка, ягодицы, ноги.</li>
<li><b>Пт</b>: лёгкий день: танцы, спина, растяжка.</li>
<li><b>Сб</b>: разминка, пилатес, кор.</li>
<li><b>Вс</b>: отдых и прогулка.</li></ul>
<p>Утром можно добавить зарядку, вечером заминку перед сном. Любая отмеченная активность засчитывается как тренировка дня.</p>
<p>Тазовое дно стоит в каждом дне, это 5–7 минут.</p>
<h4>Тазовое дно и тазобедренные суставы — разное</h4>
<p><b>Тазовое дно</b> — мышцы внизу таза, которые держат органы и отвечают за беременность, роды и восстановление после них. Их качают дыханием и сжатием-расслаблением.</p>
<p><b>Тазобедренные суставы</b> — суставы, где бедро соединяется с тазом. Для них нужна мобильность: «90/90», растяжка сгибателей бедра, круги ногами. Упражнения на них можно делать вместе с тазовым дном.</p>
<h4>Что искать на YouTube</h4><ul>
<li><b>Тазобедренные суставы</b>: hip mobility, «90/90», «бабочка», круги бедром, растяжка сгибателей бедра.</li>
<li><b>Спина</b>: back workout for beginners, кошка-корова.</li>
<li><b>Растяжка</b>: full body stretch for beginners.</li>
<li><b>Пилатес</b>: pilates core beginner, без скручиваний, если болит живот.</li>
<li><b>Танцы</b>: dance workout low impact, 15–20 минут.</li></ul>
<p>Рекомендации можно менять в разделе «План».</p>`},
{id:'food',cat:'Питание',min:3,t:'Питание при чувствительном животе',d:'Что чаще раздражает и как вести наблюдение',b:`

  const reports=ks.filter(k=>hasReport(S.days[k])).length;
  let best=0,cur=0,ws=wstart(TODAY);for(let i=0;i<104;i++){if(weekStats(ws).tr.length>=GOAL){cur++;best=Math.max(best,cur)}else if(i>0)cur=0;ws=add(ws,-7)}

    ['Первая тренировка','dumbbellm','vGreen',Math.min(trainDays,1),1],
    ['10 тренировок','sneakerm','vOrange',Math.min(trainDays,10),10],
    ['50 тренировок',23,'',Math.min(trainDays,50),50],
    ['Неделя в ритме','calendar','vAmber',Math.min(best,1),1],

}

async function setBgImage(file){
  try{
    const url=URL.createObjectURL(file),img=new Image();img.src=url;await img.decode();
    const mx=1600,k=Math.min(1,mx/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    let data=c.toDataURL('image/jpeg',.82);if(data.length>2600000)data=c.toDataURL('image/jpeg',.6);
    let kept=true;try{localStorage.setItem('kd-bgimg',data)}catch(err){kept=false}
    BGIMG=data;BGK='';BGL='img';try{localStorage.setItem('kd-bg','img')}catch(err){}
    S.profile={...S.profile,bg:'img'};render();toast(kept?'Картинка стоит на фоне':'Картинка стоит на фоне до перезагрузки, запомнить её не хватило места');
    try{await B.setProfile(clone(S.profile))}catch(err){}
  }catch(err){toast('Не получилось открыть картинку')}
}
